[package]
name = "brainpurr"
version = "1.0.2"
edition = "2024"
description = "brainpurr interpreter"
repository = "https://github.com/pommeJedusor/brainpurr"
license = "MIT"
keywords = ["cli", "brainpurr", "brainfuck"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = ["examples", ".github", "LICENSE"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
